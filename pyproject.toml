[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-qc-demo"
version = "0.1.0"
description = "Synthetic-only local clinical QC demonstration; not clinically validated"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]
